name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: windows-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::161695553579:role/github-actions-communityconnect
          aws-region: ap-south-1

      - name: Verify AWS identity
        shell: pwsh
        run: aws sts get-caller-identity
