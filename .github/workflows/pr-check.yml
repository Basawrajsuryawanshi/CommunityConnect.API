name: PR Build and Database Validation

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  DOTNET_VERSION: '10.0.x'
  SQL_PROJECT: 'src/Database/CommunityConnect.Database.sqlproj'

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: windows-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # .NET
      # ==========================================

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: dotnet restore src/Services/CommunityConnect.API/CommunityConnect.API.csproj

      - name: Build .NET
        run: dotnet build src/Services/CommunityConnect.API/CommunityConnect.API.csproj --configuration Release --no-restore

      # ==========================================
      # SQL DATABASE PROJECT
      # ==========================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQL Database Project
        run: |
          msbuild "${{ env.SQL_PROJECT }}" `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /verbosity:minimal

      # ==========================================
      # VERIFY DACPAC
      # ==========================================

      - name: Verify DACPAC
        shell: pwsh
        run: |
          $dacpac = Get-ChildItem `
            -Path . `
            -Filter "CommunityConnect.Database.dacpac" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $dacpac) {
              Write-Error "CommunityConnect.Database.dacpac was not generated."
              exit 1
          }

          Write-Host "DACPAC successfully generated:"
          Write-Host $dacpac.FullName

      # ==========================================
      # UPLOAD DACPAC
      # ==========================================

      - name: Upload DACPAC
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CommunityConnect-Database-DACPAC
          path: '**/CommunityConnect.Database.dacpac'
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # PR RESULT
      # ==========================================

      - name: Comment on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';

            const emoji = status === 'success' ? '✅' : '❌';

            const message = status === 'success'
              ? 'Build and SQL Database Project validation passed! DACPAC was generated successfully.'
              : 'Build or SQL Database Project validation failed. Please check the workflow logs.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} ${message}\n\nCommit: ${context.sha}`
            });