name: Deploy CommunityConnect

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

  AWS_ROLE_ARN: arn:aws:iam::161695553579:role/github-actions-communityconnect

  EB_APPLICATION_NAME: CommunityConnect.API
  EB_ENVIRONMENT_NAME: CommunityConnectAPI-dev

  DOTNET_VERSION: '10.0.x'

  SQL_PROJECT: 'src/Database/CommunityConnect.Database.sqlproj'

  DATABASE_NAME: CommunityConnect

  DEPLOY_PACKAGE: deployment-package-${{ github.sha }}.zip


jobs:

  # ============================================================
  # JOB 1 - BUILD API + DATABASE
  # ============================================================

  build:
    name: Build Application and Database
    runs-on: windows-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # .NET
      # ==========================================================

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}


      - name: Restore .NET dependencies
        run: |
          dotnet restore src/Services/CommunityConnect.API/CommunityConnect.API.csproj


      - name: Build .NET
        run: |
          dotnet build src/Services/CommunityConnect.API/CommunityConnect.API.csproj `
            --configuration Release `
            --no-restore


      # ==========================================================
      # PUBLISH API
      # ==========================================================

      - name: Publish API
        run: |
          dotnet publish src/Services/CommunityConnect.API/CommunityConnect.API.csproj `
            --configuration Release `
            --output ./publish `
            --no-build


      # ==========================================================
      # SQL DATABASE PROJECT
      # ==========================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      - name: Build SQL Database Project
        run: |
          msbuild "${{ env.SQL_PROJECT }}" `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /verbosity:minimal


      # ==========================================================
      # FIND DACPAC
      # ==========================================================

      - name: Locate DACPAC
        id: dacpac
        shell: pwsh
        run: |

          $dacpac = Get-ChildItem `
            -Path . `
            -Filter "CommunityConnect.Database.dacpac" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $dacpac) {
              Write-Error "DACPAC was not generated."
              exit 1
          }

          Write-Host "DACPAC found:"
          Write-Host $dacpac.FullName

          "path=$($dacpac.FullName)" >> $env:GITHUB_OUTPUT


      # ==========================================================
      # CREATE API DEPLOYMENT PACKAGE
      # ==========================================================

      - name: Create deployment package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "publish/*" `
            -DestinationPath "${{ env.DEPLOY_PACKAGE }}" `
            -Force


      # ==========================================================
      # SAVE API ARTIFACT
      # ==========================================================

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: ${{ env.DEPLOY_PACKAGE }}
          if-no-files-found: error
          retention-days: 5


      # ==========================================================
      # SAVE DATABASE ARTIFACT
      # ==========================================================

      - name: Upload DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-dacpac
          path: ${{ steps.dacpac.outputs.path }}
          if-no-files-found: error
          retention-days: 5


  # ============================================================
  # JOB 2 - DEPLOY DATABASE
  # ============================================================

  deploy-database:
    name: Deploy DACPAC to RDS
    needs: build
    runs-on: windows-latest

    steps:

      # ==========================================================
      # DOWNLOAD DACPAC
      # ==========================================================

      - name: Download DACPAC
        uses: actions/download-artifact@v4
        with:
          name: database-dacpac
          path: ./database


      # ==========================================================
      # INSTALL SQLPACKAGE
      # ==========================================================

      - name: Install SqlPackage
        shell: pwsh
        run: |

          dotnet tool install --global microsoft.sqlpackage

          $toolPath = "$env:USERPROFILE\.dotnet\tools"

          $env:PATH += ";$toolPath"

          # Persist PATH for subsequent GitHub Actions steps
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Append

          sqlpackage /Version


      # ==========================================================
      # TEST RDS CONNECTIVITY
      # ==========================================================

      - name: Test RDS connectivity
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.COMMUNITYCONNECT_DB_CONNECTION_STRING }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:DB_CONNECTION_STRING)) {
              Write-Error "COMMUNITYCONNECT_DB_CONNECTION_STRING secret is empty or not available."
              exit 1
          }

          Write-Host "Connection string secret is available."

          $connectionString = $env:DB_CONNECTION_STRING

          if ($connectionString -match '(?i)(?:Data Source|Server)\s*=\s*(?:tcp:)?([^;,]+)(?:,(\d+))?') {

              $hostName = $matches[1]
              $port = if ($matches[2]) { [int]$matches[2] } else { 1433 }

              Write-Host "RDS Host: $hostName"
              Write-Host "RDS Port: $port"

          }
          else {
              Write-Error "Could not extract RDS host from the connection string."
              exit 1
          }

          Write-Host "Testing TCP connectivity..."

          $result = Test-NetConnection `
            -ComputerName $hostName `
            -Port $port `
            -InformationLevel Detailed

          Write-Host "TCP Test Succeeded: $($result.TcpTestSucceeded)"

          if (-not $result.TcpTestSucceeded) {
              Write-Error "Cannot establish TCP connection to RDS $hostName`:$port"
              exit 1
          }

          Write-Host "RDS TCP connectivity successful."


      # ==========================================================
      # DEPLOY DACPAC TO RDS
      # ==========================================================

      - name: Deploy database to RDS
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.COMMUNITYCONNECT_DB_CONNECTION_STRING }}

        run: |

          $dacpac = Get-ChildItem `
            -Path "./database" `
            -Filter "CommunityConnect.Database.dacpac" `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $dacpac) {
              Write-Error "DACPAC not found."
              exit 1
          }

          Write-Host "Deploying DACPAC:"
          Write-Host $dacpac.FullName

          sqlpackage `
            /Action:Publish `
            /SourceFile:"$($dacpac.FullName)" `
            /TargetConnectionString:"$env:DB_CONNECTION_STRING" `
            /p:BlockOnPossibleDataLoss=True `
            /p:CreateNewDatabase=False `
            /p:DropObjectsNotInSource=False `
            /p:CommandTimeout=120


  # ============================================================
  # JOB 3 - DEPLOY API
  # ============================================================

  deploy-api:
    name: Deploy API to Elastic Beanstalk
    needs: deploy-database
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # DOWNLOAD API ARTIFACT
      # ==========================================================

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package


      # ==========================================================
      # AWS OIDC CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # VERIFY AWS IDENTITY
      # ==========================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ==========================================================
      # VERSION LABEL
      # ==========================================================

      - name: Create version label
        id: version
        shell: bash
        run: |

          VERSION_LABEL="${GITHUB_SHA}-$(date +%Y%m%d-%H%M%S)"

          echo "version_label=$VERSION_LABEL" >> "$GITHUB_OUTPUT"

          echo "Version Label: $VERSION_LABEL"


      # ==========================================================
      # GET EB S3 BUCKET
      # ==========================================================

      - name: Get S3 bucket
        id: s3bucket
        shell: bash
        run: |

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          S3_BUCKET="elasticbeanstalk-${{ env.AWS_REGION }}-${ACCOUNT_ID}"

          echo "s3_bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"

          echo "S3 Bucket: $S3_BUCKET"


      # ==========================================================
      # UPLOAD API PACKAGE
      # ==========================================================

      - name: Upload deployment package
        run: |

          aws s3 cp \
            "${{ env.DEPLOY_PACKAGE }}" \
            "s3://${{ steps.s3bucket.outputs.s3_bucket }}/${{ env.EB_APPLICATION_NAME }}/${{ steps.version.outputs.version_label }}.zip"


      # ==========================================================
      # CREATE EB APPLICATION VERSION
      # ==========================================================

      - name: Create application version
        run: |

          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "${{ steps.version.outputs.version_label }}" \
            --description "Build ${{ github.run_number }} - Commit ${{ github.sha }}" \
            --source-bundle S3Bucket="${{ steps.s3bucket.outputs.s3_bucket }}",S3Key="${{ env.EB_APPLICATION_NAME }}/${{ steps.version.outputs.version_label }}.zip" \
            --region "${{ env.AWS_REGION }}"


      # ==========================================================
      # DEPLOY TO ELASTIC BEANSTALK
      # ==========================================================

      - name: Deploy to Elastic Beanstalk
        run: |

          aws elasticbeanstalk update-environment \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "${{ steps.version.outputs.version_label }}" \
            --region "${{ env.AWS_REGION }}"


      # ==========================================================
      # WAIT FOR DEPLOYMENT
      # ==========================================================

      - name: Wait for deployment
        run: |

          echo "Waiting for Elastic Beanstalk deployment..."

          aws elasticbeanstalk wait environment-updated \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-names "${{ env.EB_ENVIRONMENT_NAME }}" \
            --region "${{ env.AWS_REGION }}"

          echo "Deployment completed."
